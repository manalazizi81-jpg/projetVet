services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: projet_vet
      POSTGRES_USER: projet_vet
      POSTGRES_PASSWORD: projet_vet_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projet_vet -d projet_vet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
